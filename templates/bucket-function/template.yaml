id: bucket-function
name: Storage-triggered function
category: Serverless
version: 1.0.0
description: >-
  A bucket plus a Go function that runs for every object uploaded to it.
  The processing logic is written once; thin entry points adapt it to S3
  events, Cloud Storage events or local MinIO webhooks.
tags: [go, serverless, lambda, s3, storage, event-driven, terraform]
vars:
  cmd: server
parameters:
  - name: go_module
    description: Go module path for the new repo
    default: "github.com/acme/[[.Name]]"
  - {name: aws_region, description: AWS region, default: us-east-1, targets: [aws]}
  - {name: gcp_project, description: GCP project id, required: true, targets: [gcp]}
  - {name: gcp_region, description: GCP region, default: us-central1, targets: [gcp]}
targets:
  aws:
    summary: S3 bucket that invokes a Lambda function on every upload
    layers: [_shared/go, _shared/tf-aws]
    resources: [S3 bucket, Lambda function, Bucket notification, IAM role]
    requires: [go, zip, terraform, aws]
  gcp:
    summary: Cloud Storage bucket that triggers a Cloud Function on every upload
    layers: [_shared/go, _shared/tf-gcp]
    resources: [Cloud Storage bucket, Cloud Function, Eventarc trigger, Service account]
    requires: [go, terraform, gcloud]
  local:
    summary: MinIO bucket that calls the handler by webhook on every upload
    layers: [_shared/go, _shared/go-docker]
    resources: [MinIO container, Handler container]
    requires: [go, docker]
