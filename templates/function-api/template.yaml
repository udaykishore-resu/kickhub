id: function-api
name: Serverless HTTP API
category: Serverless
version: 1.0.0
description: >-
  Go HTTP API that runs as a function and scales to zero. Routes are a plain
  net/http handler, so the same code is a Lambda, a Cloud Function or a
  local server depending on the entry point.
tags: [go, api, serverless, lambda, cloud-functions, terraform]
vars:
  cmd: server
parameters:
  - name: go_module
    description: Go module path for the new repo
    default: "github.com/acme/[[.Name]]"
  - {name: aws_region, description: AWS region, default: us-east-1, targets: [aws]}
  - {name: gcp_project, description: GCP project id, required: true, targets: [gcp]}
  - {name: gcp_region, description: GCP region, default: us-central1, targets: [gcp]}
targets:
  aws:
    summary: Lambda function behind a function URL
    layers: [_shared/go, _shared/go-docker, _shared/tf-aws]
    resources: [Lambda function, Function URL, IAM role, Log group]
    requires: [go, zip, terraform, aws]
  gcp:
    summary: Cloud Functions (2nd gen) HTTP function
    layers: [_shared/go, _shared/go-docker, _shared/tf-gcp]
    resources: [Cloud Function, Source bucket, Service account]
    requires: [go, terraform, gcloud]
  local:
    summary: The same handler as a container on port 8080
    layers: [_shared/go, _shared/go-docker]
    resources: [API container]
    requires: [go, docker]
