id: redis-cache
name: Redis cache
category: Databases
version: 1.0.0
description: >-
  A managed Redis cache with encryption in transit and at rest.
tags: [database, cache, redis, elasticache, memorystore, terraform]
parameters:
  - {name: aws_region, description: AWS region, default: us-east-1, targets: [aws]}
  - {name: gcp_project, description: GCP project id, required: true, targets: [gcp]}
  - {name: gcp_region, description: GCP region, default: us-central1, targets: [gcp]}
targets:
  aws:
    summary: ElastiCache for Redis with TLS and encryption at rest
    layers: [_shared/infra-only, _shared/tf-aws]
    resources: [ElastiCache replication group, Cache subnet group, Security group]
    requires: [terraform, aws]
    notes: >-
      Copy `infra/terraform.tfvars.example` to `infra/terraform.tfvars` and set your VPC and subnet ids first. Clients must connect with TLS.
  gcp:
    summary: Memorystore for Redis with AUTH and TLS
    layers: [_shared/infra-only, _shared/tf-gcp]
    resources: [Memorystore instance]
    requires: [terraform, gcloud]
    notes: >-
      Reachable only from inside the `network` VPC. Read the AUTH string with `terraform -chdir=infra output -raw auth_string`.
  local:
    summary: Redis 7 container
    layers: [_shared/infra-only]
    resources: [Redis container]
    requires: [docker]
    notes: >-
      Connect with `redis://localhost:6379`.
