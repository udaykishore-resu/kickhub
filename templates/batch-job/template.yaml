id: batch-job
name: Container batch job
category: Batch Processing
version: 1.0.0
description: >-
  A Go job packaged as a container and run to completion on demand, with no
  15-minute limit. Use it for backfills, exports and long-running work.
tags: [go, batch, container, fargate, cloud-run, terraform]
vars:
  cmd: job
parameters:
  - name: go_module
    description: Go module path for the new repo
    default: "github.com/acme/[[.Name]]"
  - {name: aws_region, description: AWS region, default: us-east-1, targets: [aws]}
  - {name: gcp_project, description: GCP project id, required: true, targets: [gcp]}
  - {name: gcp_region, description: GCP region, default: us-central1, targets: [gcp]}
targets:
  aws:
    summary: ECS task on Fargate, started with run-task
    layers: [_shared/go, _shared/go-docker, _shared/tf-aws]
    resources: [ECS cluster, Fargate task definition, ECR repository, IAM roles, Log group]
    requires: [go, docker, terraform, aws]
  gcp:
    summary: Cloud Run job, started with jobs execute
    layers: [_shared/go, _shared/go-docker, _shared/tf-gcp]
    resources: [Cloud Run job, Artifact Registry, Service account]
    requires: [go, docker, terraform, gcloud]
  local:
    summary: The job as a container you run on demand
    layers: [_shared/go, _shared/go-docker]
    resources: [Job container]
    requires: [go, docker]
