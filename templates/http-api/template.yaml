id: http-api
name: HTTP API + key-value store
category: Containers
version: 1.0.0
description: >-
  Go HTTP service with health check and a small items API behind a storage
  interface. The same handler code runs against DynamoDB, Firestore or a
  local emulator; only the adapter and the infrastructure change.
tags: [go, api, container, terraform, docker]
parameters:
  - name: go_module
    description: Go module path for the new repo
    default: "github.com/acme/[[.Name]]"
  - name: aws_region
    description: AWS region
    default: us-east-1
    targets: [aws, local]
  - name: gcp_project
    description: GCP project id
    required: true
    targets: [gcp]
  - name: gcp_region
    description: GCP region
    default: us-central1
    targets: [gcp]
targets:
  aws:
    summary: App Runner service backed by DynamoDB
    layers: [shared/dynamodb]
    resources: [App Runner, DynamoDB table, ECR repository, IAM roles]
    requires: [go, docker, terraform, aws]
  gcp:
    summary: Cloud Run service backed by Firestore
    resources: [Cloud Run, Firestore database, Artifact Registry, Service account]
    requires: [go, docker, terraform, gcloud]
  local:
    summary: docker compose with DynamoDB Local, no cloud account needed
    layers: [shared/dynamodb]
    resources: [DynamoDB Local container, API container]
    requires: [go, docker]
