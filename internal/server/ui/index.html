<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kickhub</title>
<style>
  :root { --bg:#0f1419; --panel:#182028; --line:#2a3642; --text:#e6edf3; --dim:#93a1b0; --accent:#4cc2ff; --ok:#56d364; --bad:#f0883e; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:20px 16px 8px; max-width:1100px; margin:auto; }
  h1 { margin:0 0 4px; font-size:22px; }
  header p { margin:0 0 14px; color:var(--dim); }
  main { max-width:1100px; margin:auto; padding:0 16px 40px; }
  input, select { width:100%; padding:10px 12px; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; font:inherit; }
  input:focus, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .chips { display:flex; gap:8px; margin:12px 0 4px; flex-wrap:wrap; }
  button { font:inherit; cursor:pointer; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--text); padding:7px 14px; }
  button.on, button.primary { background:var(--accent); border-color:var(--accent); color:#04222f; font-weight:600; }
  h2 { font-size:15px; color:var(--dim); margin:22px 0 10px; text-transform:uppercase; letter-spacing:.05em; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; display:flex; flex-direction:column; gap:8px; }
  .card h3 { margin:0; font-size:16px; }
  .card p { margin:0; color:var(--dim); font-size:14px; flex:1; }
  .tags { display:flex; gap:6px; flex-wrap:wrap; }
  .tag { font-size:12px; padding:1px 8px; border:1px solid var(--line); border-radius:99px; color:var(--dim); }
  .tag.t { color:var(--accent); border-color:var(--accent); }
  dialog { width:min(760px, 96vw); max-height:92vh; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:12px; padding:18px; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  label { display:block; margin:12px 0 4px; font-size:13px; color:var(--dim); }
  .row { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; align-items:center; }
  ul.res { margin:6px 0 0; padding-left:18px; color:var(--dim); font-size:14px; }
  .err { color:var(--bad); margin-top:10px; min-height:1.2em; }
  .files { margin-top:14px; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .files summary { padding:7px 12px; cursor:pointer; font:13px ui-monospace, monospace; border-top:1px solid var(--line); }
  .files details:first-child summary { border-top:0; }
  pre { margin:0; padding:12px; overflow:auto; background:#0b0f13; font:12.5px/1.45 ui-monospace, monospace; max-height:340px; }
  .req { font-size:13px; } .req .ok { color:var(--ok); } .req .no { color:var(--bad); }
</style>
</head>
<body>
<header>
  <h1>kickhub</h1>
  <p>Pick a template and a target. Get a kickstart repo with code, infrastructure and a local run path.</p>
  <input id="q" type="search" placeholder="What do you want to build? e.g. &quot;queue worker&quot; or &quot;bucket&quot;" aria-label="Search templates">
  <div class="chips" id="targets" role="group" aria-label="Filter by target"></div>
  <div class="chips" id="cats" role="group" aria-label="Filter by category"></div>
</header>
<main id="catalog"></main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h3 id="d-name" style="margin:0"></h3>
    <p id="d-desc" style="color:var(--dim);margin:6px 0 0"></p>
    <label>Target</label>
    <div class="chips" id="d-targets" style="margin:0"></div>
    <ul class="res" id="d-res"></ul>
    <label for="f-name">Component name</label>
    <input id="f-name" required pattern="[a-z][a-z0-9\-]{1,38}[a-z0-9]" placeholder="orders-api">
    <div id="d-params"></div>
    <label for="d-cli">Same thing from the terminal</label>
    <pre id="d-cli" style="border:1px solid var(--line);border-radius:8px;white-space:pre-wrap"></pre>
    <div class="row">
      <button type="button" id="b-preview">Preview files</button>
      <button type="button" class="primary" id="b-create">Download repo (.zip)</button>
      <button type="button" id="b-close">Close</button>
    </div>
    <div class="err" id="d-err" role="alert"></div>
    <div class="req" id="d-req"></div>
    <div class="files" id="d-files" hidden></div>
  </form>
</dialog>

<script>
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
let target = '', cat = '', current = null, curTarget = '';
const label = n => n === 'any' ? 'ANY CLOUD' : n.toUpperCase();

function chips(box, names, selected, onPick) {
  box.replaceChildren(...names.map(([value, label]) => {
    const b = el('button', value === selected ? 'on' : '', label);
    b.type = 'button';
    b.setAttribute('aria-pressed', value === selected);
    b.onclick = () => onPick(value);
    return b;
  }));
}

async function load() {
  chips($('targets'), [['', 'All targets'], ['aws', 'AWS'], ['gcp', 'GCP'], ['local', 'Local']], target, v => { target = v; load(); });
  const res = await fetch(`/api/templates?q=${encodeURIComponent($('q').value)}&target=${target}`);
  const list = await res.json();
  const groups = {};
  list.forEach(t => (groups[t.category] ||= []).push(t));
  if (cat && !groups[cat]) cat = '';
  chips($('cats'), [['', `All (${list.length})`], ...Object.entries(groups).map(([c, items]) => [c, `${c} (${items.length})`])], cat, v => { cat = v; load(); });
  const main = $('catalog');
  main.replaceChildren();
  if (!list.length) main.append(el('p', '', 'No templates match. Try a broader search.'));
  for (const [name, items] of Object.entries(groups)) {
    if (cat && name !== cat) continue;
    main.append(el('h2', '', `${name} (${items.length})`));
    const grid = el('div', 'grid');
    for (const t of items) {
      const card = el('div', 'card');
      card.append(el('h3', '', t.name), el('p', '', t.description));
      const tags = el('div', 'tags');
      Object.keys(t.targets).sort().forEach(n => tags.append(el('span', 'tag t', n === 'any' ? 'any cloud' : n)));
      (t.tags || []).slice(0, 4).forEach(n => tags.append(el('span', 'tag', n)));
      const b = el('button', 'primary', 'Choose');
      b.onclick = () => open(t);
      card.append(tags, b);
      grid.append(card);
    }
    main.append(grid);
  }
}

function open(t) {
  current = t;
  $('d-name').textContent = `${t.name}  ·  v${t.version}`;
  $('d-desc').textContent = t.description;
  $('d-err').textContent = '';
  $('d-files').hidden = true;
  $('d-req').replaceChildren();
  pickTarget(t.targets[target] ? target : (t.targets.local ? 'local' : Object.keys(t.targets).sort()[0]));
  $('dlg').showModal();
}

function pickTarget(name) {
  curTarget = name;
  const t = current, tg = t.targets[name];
  chips($('d-targets'), Object.keys(t.targets).sort().map(n => [n, label(n)]), name, pickTarget);
  $('d-res').replaceChildren(el('li', '', tg.summary), ...tg.resources.map(r => el('li', '', r)));
  const box = $('d-params');
  box.replaceChildren();
  for (const p of t.parameters || []) {
    if (p.targets && !p.targets.includes(name)) continue;
    const lab = el('label', '', `${p.description}${p.required ? ' (required)' : ''}`);
    lab.htmlFor = 'p-' + p.name;
    const inp = el('input');
    inp.id = 'p-' + p.name; inp.dataset.param = p.name; inp.required = !!p.required;
    inp.placeholder = (p.default || '').replace('[[.Name]]', '<name>');
    inp.oninput = cli;
    box.append(lab, inp);
  }
  $('d-files').hidden = true;
  cli();
}

function cli() {
  const req = JSON.parse(body());
  const sets = Object.entries(req.params).map(([k, v]) => ` -set ${k}='${v}'`).join('');
  $('d-cli').textContent = `kickhub new ${req.template} -name ${req.name || '<name>'} -target ${req.target}${sets}`;
}

function body() {
  const params = {};
  document.querySelectorAll('[data-param]').forEach(i => { if (i.value.trim()) params[i.dataset.param] = i.value.trim(); });
  return JSON.stringify({ template: current.id, target: curTarget, name: $('f-name').value.trim(), params });
}

async function post(path) {
  $('d-err').textContent = '';
  const res = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body() });
  if (!res.ok) { $('d-err').textContent = (await res.json()).error; return null; }
  return res;
}

$('b-preview').onclick = async () => {
  const res = await post('/api/preview');
  if (!res) return;
  const data = await res.json();
  const req = $('d-req');
  req.replaceChildren(el('span', '', 'Tools needed on the hub host: '));
  data.requires.forEach(c => req.append(el('span', c.found ? 'ok' : 'no', `${c.tool} ${c.found ? '✓' : '✗'}  `)));
  const box = $('d-files');
  box.replaceChildren(...data.files.map(f => {
    const d = el('details');
    d.append(el('summary', '', f.path), el('pre', '', f.content));
    return d;
  }));
  box.hidden = false;
};

$('b-create').onclick = async () => {
  const res = await post('/api/generate');
  if (!res) return;
  const a = el('a');
  a.href = URL.createObjectURL(await res.blob());
  a.download = $('f-name').value.trim() + '.zip';
  a.click();
  URL.revokeObjectURL(a.href);
};

$('b-close').onclick = () => $('dlg').close();
$('f-name').oninput = cli;
let timer;
$('q').oninput = () => { clearTimeout(timer); timer = setTimeout(load, 150); };
load();
</script>
</body>
</html>
